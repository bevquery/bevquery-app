<!DOCTYPE html>
<html lang="en">
<head>
 
  <link rel="icon" type="image/png" href="https://drive.google.com/file/d/15eOL2mQdacWYhrL023EhtEvW_Oi1ROdO/view?usp=drive_link">
<link rel="apple-touch-icon" href="https://drive.google.com/file/d/15eOL2mQdacWYhrL023EhtEvW_Oi1ROdO/view?usp=drive_link">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BevQuery</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background-color: #f7f9fc; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <script>
    (function () {
      var appUrl = "https://script.google.com/macros/s/AKfycbzev8E18-jhMhql4c2LWlIU_jmKX6hN5TgFy1mRDwyPeUHfZOdmwSuOSs8C-nnQ5awZ/exec";
      var token = "";

      try {
        token =
          window.localStorage.getItem("bevq_token") ||
          window.localStorage.getItem("bevquery_token") ||
          "";
      } catch (e) {}

      if (token) {
        appUrl += "?sid=" + encodeURIComponent(token);
      }

      window.location.replace(appUrl);
    })();
  </script>

  <p style="font-family:Arial,sans-serif;padding:20px;">
    Opening BevQuery...
    <a href="https://script.google.com/macros/s/AKfycbzev8E18-jhMhql4c2LWlIU_jmKX6hN5TgFy1mRDwyPeUHfZOdmwSuOSs8C-nnQ5awZ/exec">
      Click here if you are not redirected.
    </a>
  </p>
</body>
</html>
